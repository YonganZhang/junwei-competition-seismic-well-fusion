pipeline: fault_agentic_optimization
description: "①断层：校验开发证据、候选动作、晋级决策与默认模型，不把未过门槛的智能体路线写成成功。"
domain: ml_research
status: active
entry_role: main
verification_method: validate
steps:
  - id: validate
    ref: code:track_lifecycle_verify
    params: {track: fault, stage: validate}
    success:
      outputs_exist: [_pipelines/02_task_datasets/fault/_outputs/p29_agent_action_effect/summary.json]
  - id: prepare
    ref: code:track_lifecycle_verify
    needs: [validate]
    params: {track: fault, stage: prepare}
    success:
      outputs_exist: [_pipelines/02_task_datasets/fault/_outputs/p29_agent_action_effect/summary.json]
  - id: baseline
    ref: code:track_lifecycle_verify
    needs: [prepare]
    params: {track: fault, stage: baseline}
    success:
      outputs_exist: [_pipelines/02_task_datasets/fault/_outputs/p29_agent_action_effect/summary.json]
  - id: optimize
    ref: code:track_lifecycle_verify
    needs: [baseline]
    params: {track: fault, stage: optimize}
    success:
      outputs_exist: [_pipelines/02_task_datasets/fault/_outputs/p29_agent_action_effect/summary.json]
  - id: promote
    ref: code:track_lifecycle_verify
    needs: [optimize]
    params: {track: fault, stage: promote}
    success:
      outputs_exist: [_pipelines/02_task_datasets/fault/_outputs/p29_agent_action_effect/summary.json]
  - id: refit
    ref: code:track_lifecycle_verify
    needs: [promote]
    params: {track: fault, stage: refit}
    success:
      outputs_exist: [_pipelines/02_task_datasets/fault/_outputs/p29_agent_action_effect/summary.json]
  - id: verify
    ref: code:track_lifecycle_verify
    needs: [refit]
    params: {track: fault, stage: verify}
    success:
      outputs_exist: [_pipelines/02_task_datasets/fault/_outputs/p29_agent_action_effect/summary.json]
