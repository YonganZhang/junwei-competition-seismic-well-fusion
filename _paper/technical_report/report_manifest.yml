  language: zh-CN
  source_format: LaTeX
  compiler: XeLaTeX
  writing_style: yongan_prose_kernel
  expansion_policy: section_files_plus_appendices
  canonical_pdf: "_paper/technical_report/build/junwei_six_track_technical_report.pdf"
  canonical_pdf_sha256: "bd793ea45c7687ee842e44d9a3c61af1e8978aaa08dd40e5f41c54aedf733b21"
  page_count: 45
