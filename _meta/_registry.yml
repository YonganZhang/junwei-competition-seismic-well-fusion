# _meta/_registry.yml — code-domain / entrypoint registry
project: 军伟的比赛-地震测井多模态融合
schema_version: code-domain-v1
last_synced: 2026-07-14 (P5 Stage-3 multiseed CV acceptance)

# Default v4 registry is coarse-grained. Register code domains, public entrypoints,
# reusable scripts/tools, and cross-domain edges. Do not default to a function ledger.

code_domains:
  - id: main
    path: _code
    type: local_code
    status: active
    owner: project
    codemap: _codemap.md
    description: "Primary reusable code or project wrapper entrypoints."

  - id: dataset_io
    path: _code/dataset_io.py
    type: shared_library
    status: active
    owner: project
    description: >
      六赛道统一数据接口：save_split()/load_dataset()/dataset_stats()。
      固定样本schema(seismic_patch/well_log_seq/position/label/meta)，
      6条赛道的build_dataset.py都调用它写出train/test，建模代码都调用它读取，
      不允许绕过此接口直接手写HDF5读写。python -m dataset_io stats <task>/<split> 可查统计。

  - id: common_preprocess
    path: _pipelines/01_common_preprocess
    type: pipeline
    status: active
    owner: project
    description: >
      Layer1公共预处理(6条赛道共用，不属于任何单一赛道)：4个step已用真实Volve数据跑通。
      step_01_load_seismic.py：segyio读ST0202/Stacks/..FULL_OFFSET_PP_TIME(PZ全偏移距PP时间叠后体，
      1.1GB，inline 9985-10369×crossline 1932-2536规则网格)，按需读道+UTM<->il/xl仿射索引，不整体入内存。
      step_02_load_well_logs.py：lasio读06.LFP目录3口井(15_9-19 A/BT2/SR)LAS，每口171条LFP_*曲线，
      选LFP_GR/RHOB/NPHI/DT/DTS/RT/CALI/VSH/PHIE共9条做"核心九线"，缺失值/野值清洗+0.5m重采样+
      GR泥岩基线归一化(用逐点LFP_GRMIN/GRMAX)+其余z-score。
      step_03_load_fault_horizon.py：定长文本解析Volve_Official_Faults.dat(3998点/66条断层)，
      通用CSV解析Horizons_TWT/Other_Horizons下BCU层位(225558点)，断层UTM反解最近il/xl，层位IL/XL
      本身已与ST0202体一致(实测验证过范围吻合)。
      step_04_well_tie_weak.py：弱井震标定——用Well_picks_Volve_v1.dat同井分层点的MD/TWT/UTM做
      分段线性插值+外推(非速度模型)，得到深度->TWT->最近(il,xl)的粗略轨迹，代码内注释明确标注
      为弱标定局限。outputs/下产出可复用中间文件，产出清单见pipeline README。

  - id: task_datasets
    path: _pipelines/02_task_datasets
    type: pipeline
    status: active
    owner: project
    description: >
      Layer2每赛道样本构建器，子目录 fault/facies/reservoir/lithofacies/sweetspot/reconstruction，
      各自build_dataset.py读Layer1产出+对应标签源，调用dataset_io.save_split()写出统一schema的train/test。
      ①②⑥已用Codex worker(leader mode)跑通baseline:①fault逻辑回归+局部卷积特征，
      ②facies_f3/facies_penobscot各自SmallUNet(F3/Penobscot标签空间不兼容,不强行统一),
      ⑥reconstruction岭回归+IDW。当前均为验证管道用的简单baseline,非最终模型。

  - id: ml_framework
    path: _code/ml_framework
    type: shared_library
    status: active
    owner: project
    description: >
      P4共享训练/评价合同：ModelBatch/ModelOutput外层、TaskSpec、模型动态发现、
      全局seed=2693与确定性报告、group/spatial split manifest、按样本或有效标签加权reducer、
      checkpoint/resume包含优化器与RNG状态、可选HPO plan/backend、artifact manifest/hash、
      SPLIT_LOCKED→CV_COMPLETE→CONFIG_FROZEN→REFIT_COMPLETE→TEST_CONSUMED一次性test firewall。
      任务内部loss/activation/mask/metric由插件显式声明，不强迫六赛道共用一个head。

  - id: canonical_models
    path: _models
    type: shared_library
    status: active
    owner: project
    description: >
      六赛道规范模型唯一真源：fault/facies/property/lithofacies/reconstruction/sweetspot。
      每个可替换模型是独立<model_id>.py并导出build_model()；旧赛道models目录仅保留兼容shim。

  - id: sweetspot_targets
    path: _pipelines/02_task_datasets/sweetspot/targets
    type: pipeline
    status: active
    owner: project
    description: >
      ⑤甜点一赛道七任务案例：储层品质代理、SAND_FLAG有效厚度代理、产能、
      见水风险代理、剩余油/加密井simulation case、PHIF孔隙度、KLOGH渗透率。
      每个目标独立task_id/split/config/checkpoint/metrics/figure或not_feasible；
      _outputs/registry_targets_1_to_7.json汇总状态和哈希。

entrypoints:
  - id: project_plan
    path: _wiki-methodology/_top/_task_plan.md
    type: plan
    status: active
    owner: col2
    description: "Current phase, next action, blockers and pause list."

  - id: p4_acceptance
    path: _wiki-methodology/_tests/P4_acceptance_evidence.md
    type: test_evidence
    status: active
    owner: col3
    description: "P4 portable suites, real smoke, CV/refit/frozen-test metrics, artifact verification and honest blockers."

  - id: p5_stage1_acceptance
    path: _wiki-methodology/_tests/P5_stage1_acceptance_evidence.md
    type: test_evidence
    status: active
    owner: col3
    description: "P5 first-batch open-model contract attempts, cross-track integration gates, structured skips and scientific stop lines."

  - id: p5_stage2_acceptance
    path: _wiki-methodology/_tests/P5_stage2_acceptance_evidence.md
    type: test_evidence
    status: active
    owner: col3
    description: "P5 fixed-budget development pilots, per-lane rankings, GPU-lock evidence, structured scientific stops and cross-track integration gates."

  - id: p5_stage3_protocol
    path: _wiki-methodology/_top/_phases/P5_stage3_multiseed_cv.md
    type: plan
    status: active
    owner: col2
    description: "Frozen top-3 by task/lane, three derived seeds, all valid development folds, OOF visualization and final test-firewall contract."

  - id: p5_stage3_acceptance
    path: _wiki-methodology/_tests/P5_stage3_acceptance_evidence.md
    type: test_evidence
    status: active
    owner: col3
    description: "P5 top-3 multiseed all-valid-fold results, per-task winners, OOF visualizations, honest failed/timeout cells, dependency-group regression and frozen-test firewall."

  - id: sweetspot_target_registry
    path: _pipelines/02_task_datasets/sweetspot/targets/_outputs/registry_targets_1_to_7.json
    type: artifact_registry
    status: active
    owner: project
    description: "Seven independent target cases and their content hashes."

cross_domain_edges:
  - from: task_datasets
    to: dataset_io
    relation: calls
  - from: task_datasets
    to: common_preprocess
    relation: depends_on
  - from: task_datasets
    to: ml_framework
    relation: calls
  - from: task_datasets
    to: canonical_models
    relation: discovers
  - from: sweetspot_targets
    to: ml_framework
    relation: calls
  - from: sweetspot_targets
    to: canonical_models
    relation: discovers

non_code_assets:
  registry: _meta/_data_registry.yml
