# _meta/_registry.yml — code-domain / entrypoint registry
project: 军伟的比赛-地震测井多模态融合
schema_version: code-domain-v1
last_synced: 2026-08-04 (P35 fault/reconstruction interface closeout)

# Default v4 registry is coarse-grained. Register code domains, public entrypoints,
# reusable scripts/tools, and cross-domain edges. Do not default to a function ledger.

code_domains:
  - id: main
    path: _code
    type: local_code
    status: active
    owner: project
    codemap: _codemap.md
    description: "Primary reusable code or project wrapper entrypoints."

  - id: dataset_io
    path: _code/dataset_io.py
    type: shared_library
    status: active
    owner: project
    description: >
      六赛道统一数据接口：save_split()/load_dataset()/dataset_stats()。
      固定样本schema(seismic_patch/well_log_seq/position/label/meta)，
      6条赛道的build_dataset.py都调用它写出train/test，建模代码都调用它读取，
      不允许绕过此接口直接手写HDF5读写。python -m dataset_io stats <task>/<split> 可查统计。

  - id: common_preprocess
    path: _pipelines/01_common_preprocess
    type: pipeline
    status: active
    owner: project
    description: >
      Layer1公共预处理(6条赛道共用，不属于任何单一赛道)：4个step已用真实Volve数据跑通。
      step_01_load_seismic.py：segyio读ST0202/Stacks/..FULL_OFFSET_PP_TIME(PZ全偏移距PP时间叠后体，
      1.1GB，inline 9985-10369×crossline 1932-2536规则网格)，按需读道+UTM<->il/xl仿射索引，不整体入内存。
      step_02_load_well_logs.py：lasio读06.LFP目录3口井(15_9-19 A/BT2/SR)LAS，每口171条LFP_*曲线，
      选LFP_GR/RHOB/NPHI/DT/DTS/RT/CALI/VSH/PHIE共9条做"核心九线"，缺失值/野值清洗+0.5m重采样+
      GR泥岩基线归一化(用逐点LFP_GRMIN/GRMAX)+其余z-score。
      step_03_load_fault_horizon.py：定长文本解析Volve_Official_Faults.dat(3998点/66条断层)，
      通用CSV解析Horizons_TWT/Other_Horizons下BCU层位(225558点)，断层UTM反解最近il/xl，层位IL/XL
      本身已与ST0202体一致(实测验证过范围吻合)。
      step_04_well_tie_weak.py：用Well_picks_Volve_v1.dat同井分层点的MD/TWT/UTM做
      分段线性插值+外推，仅作为早期弱标定产物保留。项目后续获取的
      Volve VSP 归档含 5 口井 checkshot；新研究实验使用 P23 的 3 拟合井/
      2 独立校验井口径。outputs/下产出可复用中间文件，产出清单见pipeline README。

  - id: task_datasets
    path: _pipelines/02_task_datasets
    type: pipeline
    status: active
    owner: project
    description: >
      Layer2六赛道样本、训练、评价与结果管线，子目录为
      fault/facies/reservoir/lithofacies/sweetspot/reconstruction。P4--P24累计研究线已于
      2026-08-01合并到`master@8375b97`；赛道⑥默认为P21，P20 PEFT路线默认关闭。
      以下为2026-07-13合并前历史快照：当时主仓该路径下6个子目录为空占位骨架，具体build_dataset.py/
      baseline.py/models等实现均只存在于对应git worktree分支(`.claude/worktrees/track-*`)，
      各分支已有1个已验收commit(见下方SHA)，但尚未merge进master，主仓意义上的"active代码"
      目前不存在，不要把worktree候选误当作已集成的主仓代码。
      2026-07-13：六条赛道baseline pipeline候选均已在各自隔离worktree完成真实Volve/F3/Penobscot
      数据端到端验收(独立verify通过)，随后完成合并前可移植性收口，当前每条赛道的Git候选文件数/
      字节数为：①fault 21/377889B、②facies 23/533617B、③reservoir 19/465560B、
      ④lithofacies 18/679284B、⑤sweetspot 10/147413B、⑥reconstruction 34/1071933B。
      六个worktree分支各自已提交1个commit(ahead=1/behind=0 relative to master)，真实SHA：
      ①fault `09abe70905f988f4585debbd2216a6a2542e5dfd`、②facies `5f70a33e23227f45bb401d077630ff594d477b14`、
      ③reservoir `ea3b0f35c0dd05173b38be83834f87b82315f875`、④lithofacies `84839c2421143804e7c923c30500cf03eefc7078`、
      ⑤sweetspot `b13d876349c55834abc36550864d6b6f19bda9cd`、⑥reconstruction `1a142f3787b18999123a9750fcd8bea30001d822`。
      当时commit未合并进master，task_datasets路径仍是空骨架；该状态已由P26取代。
      科学状态摘要(细节见对应finding，不在此重复指标表)：①逻辑回归局部特征baseline，召回高精度低；
      ②facies_f3/facies_penobscot各自SmallUNet(标签空间不兼容,不强行统一)；③PHIF/log1p(KLOGH)/SW
      三输出多模态回归；④9类GM09 GENETIC FACIES多模态分类；⑤仅fail-closed的label_spec合同与
      validate-only审计基础设施，未生成任何标签/数据集/模型(标签定义待军伟批准)；⑥conditional/
      strict双模式重建对比。均为验证管道用的简单baseline,非最终模型。各分支选择性commit已完成，
      当时的merge待授权状态已由P26关闭，历史证据见`_wiki-methodology/_top/_findings/P2.6`。

  - id: six_track_agentic_lifecycle
    path: _pipelines/02_task_datasets/track_lifecycle.py
    type: pipeline
    status: active
    owner: project
    description: >
      P31--P35 六赛道独立 pipeline 的共享证据校验器。七段生命周期为
      validate/prepare/baseline/optimize/promote/refit/verify；读取各赛道已归档的
      P29/P30/P32/P33/default 证据，验证默认模型、候选动作和晋级结论一致。
      拒绝路线是合法结果，缺失字段、漂移结论或假晋级直接失败。

  - id: fault_p30_finalize
    path: _pipelines/02_task_datasets/fault/fault_p30_finalize.py
    type: pipeline_step
    status: active
    owner: project
    description: "Atomically rebuild the ST10010 aligned 3-D development asset and run the final CIG-Bench lift/tolerance audit."

  - id: reconstruction_p29_action_effect_v2
    path: _pipelines/02_task_datasets/reconstruction/p29_agent_action_effect_repair.py
    type: pipeline_step
    status: active
    owner: project
    description: "Run the repaired held-fold agent action probe with explicit feature-cache and query-side modality inputs."

  - id: reconstruction_p30_geostatistics_v2
    path: _pipelines/02_task_datasets/reconstruction/p30_bounded_geostatistics_feasibility.py
    type: pipeline_step
    status: active
    owner: project
    description: "Audit bounded geostatistical candidates against P21 and emit the well-log/seismic cross-modal fusion I/O contract."

  - id: six_track_pipeline_runtime
    path: _code/six_track_pipeline
    type: shared_library
    status: active
    owner: project
    description: >
      P34 六赛道统一 Pipeline 接口：发现六个赛道 adapter，固定
      validate/prepare/baseline/optimize/promote/refit/verify 七段顺序，提供
      list/plan/preflight/verify 公共入口。依赖闭包阻止跳过预处理或智能体阶段；
      execute 意图在参数、输入或可执行适配未齐时于任何动作前失败。

  - id: research_visualization
    path: _pipelines/05_research_visualization_expansion
    type: pipeline
    status: active
    owner: project
    description: >
      六赛道真实数据科研图件与三维视图入口；统一使用
      `_code/visualization/geo3d_viz.py` 的出版样式、哈希和provenance辅助函数。
      主脚本只读已归档观测/预测，不训练、不选模、不生成地质伪数据；
      六赛道总览中的三维重建路径固定为 P21 三邻域核，产物由
      `research_visualization_expansion`流水线的机器哈希门禁验证。

  - id: ml_framework
    path: _code/ml_framework
    type: shared_library
    status: active
    owner: project
    description: >
      P4共享训练/评价合同：ModelBatch/ModelOutput外层、TaskSpec、模型动态发现、
      全局seed=2693与确定性报告、group/spatial split manifest、按样本或有效标签加权reducer、
      checkpoint/resume包含优化器与RNG状态、可选HPO plan/backend、artifact manifest/hash、
      SPLIT_LOCKED→CV_COMPLETE→CONFIG_FROZEN→REFIT_COMPLETE→TEST_CONSUMED一次性test firewall。
      任务内部loss/activation/mask/metric由插件显式声明，不强迫六赛道共用一个head。

  - id: canonical_models
    path: _models
    type: shared_library
    status: active
    owner: project
    description: >
      六赛道规范模型唯一真源：fault/facies/property/lithofacies/reconstruction/sweetspot。
      每个可替换模型是独立<model_id>.py并导出build_model()；旧赛道models目录仅保留兼容shim。

  - id: sweetspot_targets
    path: _pipelines/02_task_datasets/sweetspot/targets
    type: pipeline
    status: active
    owner: project
    description: >
      ⑤甜点一赛道七任务案例：储层品质代理、SAND_FLAG有效厚度代理、产能、
      见水风险代理、剩余油/加密井simulation case、PHIF孔隙度、KLOGH渗透率。
      每个目标独立task_id/split/config/checkpoint/metrics/figure或not_feasible；
      _outputs/registry_targets_1_to_7.json汇总状态和哈希。

  - id: foundation_model_routes
    path: _models/gaia_dagt
    type: shared_library
    status: active
    owner: project
    description: >
      P8 六赛道模态匹配基础模型路由：统一 FoundationTaskEnvelope、time/support/depth/spatial/
      masked-volume 条件、可见性与晋级状态机；固定 source/weights revision、size/SHA、许可证状态，
      运行时禁止自动下载。监督 LLM 仅做 schema/QC，严格 JSON，不读取标签、测试指标、路径或凭证。

  - id: reconstruction_foundation_geostatistics
    path: _pipelines/02_task_datasets/reconstruction/p17_foundation_geostatistics.py
    type: pipeline
    status: active
    owner: project
    description: >
      P17 赛道⑥开发优化：冻结 ThinkOnward GFM 提供目标无关地震表征，
      每个空间外折仅用 512 条合法训练标签拟合标准化/PCA，以弱加权表征
      构建非平稳邻域并与 PyKrige 保守融合。只产生 DEVELOPMENT_SIGNAL，
      无 test/holdout 入口，默认不启用。

  - id: reconstruction_anisotropic_foundation_geostatistics
    path: _pipelines/02_task_datasets/reconstruction/p18_anisotropic_foundation_geostatistics.py
    type: pipeline
    status: superseded
    superseded_by: reconstruction_meta_purged_geostatistics
    owner: project
    description: >
      P18 赛道⑥历史开发优化：复用哈希锁定的真实预训练 GFM 表征，显式搜索
      垂向各向异性，并对每个报告空间折只用其余四折的指标行进行 top-3 候选选择。
      P19 发现其余折训练子集与当前验证坐标存在间接重叠，因此 P18 已被更严格的
      元拟合坐标去重协议取代；默认不启用。

  - id: reconstruction_meta_purged_geostatistics
    path: _pipelines/02_task_datasets/reconstruction/p19_meta_purged_geostatistics.py
    type: pipeline
    status: active
    owner: project
    description: >
      P19 赛道⑥严格开发优化：对每个报告空间折，先从其余折的元选择训练子集中
      删除当前验证坐标，再重新拟合缩放、PCA、近邻模型与全部候选；最终折预测仍
      严格使用 512 条合法训练标签。无 test/holdout 入口，默认不启用，不作预训练
      因果归因。

  - id: reconstruction_fixed_foundation_ensemble
    path: _pipelines/02_task_datasets/reconstruction/p21_fixed_foundation_ensemble.py
    type: pipeline
    status: active
    owner: project
    description: >
      P21 赛道⑥当前默认：固定平均三个真实预训练 GFM 邻域核，去除逐折
      元选择；保持每折 512 条标签并与 PyKrige 保守融合。开发 OOF RMSE
      为 0.027734374378，不声称 LoRA 或预训练表征的因果消融结论。

  - id: reconstruction_historical_transfer
    path: _pipelines/02_task_datasets/reconstruction/p24_historical_transfer.py
    type: pipeline
    status: active
    owner: project
    description: >
      P24 赛道⑥预注册一次性迁移门：把未使用的 RMS 历史 pp04phif 属性
      精确映射到现有 KJI 折，冻结 P21 与 PyKrige 对照。结果相对 RMSE
      改善 1.4529%、4/5 折获胜；只支持同场区历史版本迁移，不是 fresh blind。

  - id: reconstruction_checkshot_calibration
    path: _pipelines/02_task_datasets/reconstruction/p23_checkshot_calibration.py
    type: pipeline
    status: active
    owner: project
    description: >
      P23 赛道⑥时深标定验证：用 19A/19BT2/19SR checkshot 和 TVDSS
      轨迹拟合空间时深关系，F11T2/F15A 完全保留为独立校验井。
      不读孔隙度标签、reconstruction HDF5、test 或 holdout；产物状态限定为
      VALIDATED_CALIBRATION_ONLY，不替代 P21 默认模型。

  - id: domain_visualization_delivery
    path: _pipelines/03_domain_visualization_delivery
    type: pipeline
    status: active
    owner: project
    description: >
      六赛道真实领域图唯一卡片渲染入口。清单必须绑定可达的来源commit、图片SHA-256、
      来源脚本blob、Git跟踪策略、证据文件和人工复核哈希；允许工作树HEAD继续前进，
      但来源commit不可分叉、图片和来源脚本不可漂移；状态/协议/门禁/占位图路径直接拒绝。
      通过后复制到稳定交付目录并再次验哈希，只有显式--yes-public才调用pubfile，
      每个永久URL还必须HTTP 200。测试入口见 `_wiki-methodology/_tests/_gates.yml`
      中 id=`domain-visualization-delivery`。P12 扩展只处理赛道1/3/5：由
      `step_00_discover.py` 固定发现渲染器/测试/manifest，由负责人逐图检查后再运行
      `step_04_stage_p12_review.py`，把 13 张 PNG 及其 PDF/SVG 同伴复制到稳定目录并写入
      独立 `review_attestation.json`；赛道2/4/6保持 paused。

