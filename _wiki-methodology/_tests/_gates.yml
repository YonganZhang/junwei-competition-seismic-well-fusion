# COL3 portable gates. All commands run from the project root.
gates:
  - id: p4-shared
    cmd: "${P4_TORCH_PYTHON:?set P4_TORCH_PYTHON to a Python with torch} -m unittest discover -s _code/ml_framework/tests -p 'test_*.py' -v"
    timeout: 180
    expect: exit0
    note: "Shared contracts and canonical model discovery."

  - id: p4-fault
    cmd: "python3 -m unittest discover -s _pipelines/02_task_datasets/fault -p 'test_*.py' -v"
    timeout: 300
    expect: exit0
    note: "Fault portable suite; unavailable optional real artifacts must report skip."

  - id: p4-facies
    cmd: "${P4_TORCH_PYTHON:?set P4_TORCH_PYTHON to a Python with torch} -m unittest discover -s _pipelines/02_task_datasets/facies/tests -p 'test_*.py' -v"
    timeout: 600
    expect: exit0
    note: "F3 and Penobscot contracts, lifecycle, tiny models and portable smoke."

  - id: p4-property
    cmd: "python3 -m pytest _pipelines/02_task_datasets/reservoir/tests -q"
    timeout: 300
    expect: exit0
    note: "PHIF/KLOGH/SW contracts; external data integrations are explicitly gated."

  - id: p4-lithofacies
    cmd: "${P4_TORCH_PYTHON:?set P4_TORCH_PYTHON to a Python with torch} -m unittest discover -s _pipelines/02_task_datasets/lithofacies/tests -p 'test_*.py' -v"
    timeout: 300
    expect: exit0
    note: "Nine-class family-split contracts and portable pipeline suite."

  - id: p4-sweetspot
    cmd: "python3 -m pytest _pipelines/02_task_datasets/sweetspot/tests -q"
    timeout: 300
    expect: exit0
    note: "Seven independent targets, proxy boundaries and not-feasible gates."

  - id: p4-reconstruction
    cmd: "python3 -m unittest discover -s _pipelines/02_task_datasets/reconstruction/_tests -p 'test_*.py' -v"
    timeout: 600
    expect: exit0
    note: "Strict/conditional reconstruction and direct project-root CLI regressions."

  - id: p4-target-registry
    cmd: "python3 -m _pipelines.02_task_datasets.sweetspot.targets.registry --output _tmp/p4-target-registry-audit.json"
    timeout: 120
    expect: exit0
    note: "Rebuild the seven-target registry without overwriting the canonical evidence file."

  - id: p5-stage3-fault
    cmd: "${P5_TORCH_PYTHON:?set P5_TORCH_PYTHON to torch-common} -m pytest -q _pipelines/02_task_datasets/fault/test_fault_p5_stage3.py"
    timeout: 180
    expect: exit0
    note: "Fault Stage-3 zero-fold data gate and no-fake-performance contract."

  - id: p5-stage3-facies
    cmd: "${P5_TORCH_PYTHON:?set P5_TORCH_PYTHON to torch-common} -m pytest -q _pipelines/02_task_datasets/facies/tests/test_facies_p5_stage3.py"
    timeout: 300
    expect: exit0
    note: "F3/Penobscot separate top-3 multiseed OOF contracts."

  - id: p5-stage3-property
    cmd: "${P5_TABULAR_PYTHON:?set P5_TABULAR_PYTHON to tabular-cpu} -m pytest -q _pipelines/02_task_datasets/reservoir/tests/test_reservoir_p5_stage3.py"
    timeout: 180
    expect: exit0
    note: "PHIF/KLOGH/SW LOGO4 multiseed summaries and firewall."

  - id: p5-stage3-lithofacies
    cmd: "${P5_TABULAR_PYTHON:?set P5_TABULAR_PYTHON to tabular-cpu} -m pytest -q _pipelines/02_task_datasets/lithofacies/tests/test_lithofacies_p5_stage3.py"
    timeout: 180
    expect: exit0
    note: "Fixed-nine GM09 ranking, honest failed cells and OOF visualization contract."

  - id: p5-stage3-sweetspot
    cmd: "${P5_TABULAR_PYTHON:?set P5_TABULAR_PYTHON to tabular-cpu} -m pytest -q _pipelines/02_task_datasets/sweetspot/tests/test_sweetspot_p5_stage3.py"
    timeout: 300
    expect: exit0
    note: "Seven independent sweetspot cases; T1-T4 rank and T5-T7 stop gates."

  - id: p5-stage3-reconstruction
    cmd: "${P5_TORCH_PYTHON:?set P5_TORCH_PYTHON to torch-common} -m pytest -q _pipelines/02_task_datasets/reconstruction/_tests/test_reconstruction_p5_stage3.py"
    timeout: 300
    expect: exit0
    note: "Strict/conditional multiseed buffered-CV summaries, timeout retention and firewall."
