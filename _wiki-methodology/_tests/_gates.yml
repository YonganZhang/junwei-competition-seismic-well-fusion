# COL3 gates manifest — 项目"可一键跑"的测试/校验闸门(机器外壳, 内容每项目自填)
#
# 用途(理念: 框架只给通用外壳):
# - AI/人 跑 gate: 照 cmd 在项目根执行(信任级 = 项目内 Bash; timeout 必填)
# - topic-brief 报 `tests: ... gates=N`; topic-doctor 活跃项目缺这份文件 → info 提醒
# - CodeBook 节点的 owner_refs `test:<id>` 按这里的 gate id 解析(单一命名空间)
#
# 字段: id(唯一)/ cmd(项目根为 cwd)/ timeout(秒)/ expect(目前唯一语义 exit0)/ note(可选)
gates: []
